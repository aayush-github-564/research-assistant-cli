[project]
name = "research-assistant-cli"
version = "0.1.0"
description = "RAG agent system in miniature which searches, fetches sources, stores them locally, and eventually lets you semantically query your accumulated research and get LLM-summarized answers."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.7.0",
    "cohere>=7.1.1",
    "ddgs>=9.14.4",
    "google-genai>=2.24.0",
    "ipykernel>=7.3.0",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "tavily-python>=0.7.26",
    "trafilatura>=2.2.0",
]

[project.scripts]
research-assistant = "research_assistant_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant_cli"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
